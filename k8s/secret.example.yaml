apiVersion: v1
kind: Secret
metadata:
  name: fiapdonateworker-secret
type: Opaque
stringData:
  RabbitMq__Password: "guest"
  # Host "sqlserver" assume o nome do Service Kubernetes exposto pela infra
  # compartilhada (repositório FiapDonateServices). Ajuste se o nome real for outro.
  ConnectionStrings__WorkerDb: "Server=sqlserver,1433;Database=conexao_solidaria;User Id=sa;Password=CHANGE_ME;TrustServerCertificate=True;"
